<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>*{box-sizing:border-box}
nav[hidden],.expression-demo[hidden]{display:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#dfedfb;color-scheme:dark}
#stage{height:100%;display:grid;grid-template-rows:30px minmax(0,1fr) 26px;background:radial-gradient(ellipse at 50% 58%,#17334d 0,#0b182b 55%,#081220 100%);border:1px solid #343d50;border-radius:16px;overflow:hidden}
body.light{color:#253c52;color-scheme:light}
body.light #stage{background:radial-gradient(ellipse at 50% 58%,#e5eff9 0,#f3f7fc 60%,#f8fbff 100%);border-color:#d7dce7}
body.light header>span,body.light footer,body.light .hint{color:#344a61}
body.light button{color:#253c52;background:#e5eef8;border-color:#9bb3cb}
body.light button:hover{background:#d5e6f5;border-color:#478da5}
body.light button:active{background:#c5dcec}
body.light button:focus-visible,body.light canvas:focus-visible{outline-color:#087e9e}
header,footer{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;min-width:0}
header>span{font-size:9px;letter-spacing:.6px;white-space:nowrap;color:#a6cee5}
nav{display:flex;gap:4px}
button{font:inherit;font-size:10px;color:#dff6ff;background:#182f45;border:1px solid #4b6e87;border-radius:6px;padding:3px 6px;min-height:24px;cursor:pointer;touch-action:manipulation}
button:hover{background:#284d67;border-color:#66d7ef}button:active{background:#356080}
button:focus-visible,canvas:focus-visible{outline:2px solid #6fe4ff;outline-offset:-3px}
button:disabled{opacity:.5;cursor:default}
#viewport{min-width:0;min-height:0;position:relative;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#fallback{position:absolute;inset:0;display:grid;place-items:center}
#fallback[hidden]{display:none}
#fallback .robot{height:95%;width:100%;display:grid;place-items:center}
#fallback svg{height:100%;max-width:90%}#fallback .holo-stage{display:none}
footer{font-size:9px;color:#a6bed3;line-height:1.25}
#status{overflow-wrap:anywhere}.hint{color:#b5d5e8;text-align:right}
body.card .hint{display:none}
@media(max-width:330px){header>span{font-size:8px;letter-spacing:0}header,footer{padding:0 6px}nav{gap:2px}button{padding:2px 4px;font-size:9px}.hint{display:none}}
@media(max-width:280px){header>span{display:none}header{justify-content:flex-end}}
#stage:not(.ready) footer{height:auto}#stage:not(.ready){grid-template-rows:30px minmax(0,1fr) minmax(26px,auto)}
/* Chỉ tăng khả năng đọc của hero; giữ nguyên hàng header/footer và canvas. */
body.hero header>span{font-size:10px;letter-spacing:.3px}
body.hero footer{font-size:11px}
body.hero button{font-size:12px;line-height:1.2;min-height:28px;padding:2px 6px}
@media(max-width:420px){body.hero header>span{letter-spacing:0}body.hero header,body.hero footer{padding:0 6px}body.hero nav{gap:3px}body.hero button{font-size:11px;padding:2px 4px}body.hero footer{font-size:10px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
.expression-demo{display:flex;align-items:center;gap:4px;min-width:0;font-size:9px;line-height:1.1}
.expression-demo small{display:block;font-size:8px}
.expression-demo select{font:inherit;font-size:10px;min-width:0;max-width:112px;height:24px;color:#dff6ff;background:#182f45;border:1px solid #4b6e87;border-radius:6px}
.expression-demo select:focus-visible{outline:2px solid #6fe4ff;outline-offset:-2px}
body.light .expression-demo select{color:#253c52;background:#e5eef8;border-color:#9bb3cb}
body.light .expression-demo select:focus-visible{outline-color:#087e9e}
@media(max-width:240px){.expression-demo{font-size:8px}.expression-demo select{max-width:92px;font-size:9px}footer{gap:3px}}
</style></head>

</svg></div></div>
